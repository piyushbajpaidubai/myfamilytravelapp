apply plugin: 'com.android.application'

// Release signing. Credentials live in android/keystore.properties, which is
// gitignored — if it is absent the release build stays unsigned rather than failing.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "mytravelhub.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "35.0.1"
    defaultConfig {
        applicationId "mytravelhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two apps from one codebase. They differ in identity and in which backend they talk
    // to, never in source. `travel` keeps the original applicationId — changing it would
    // make every installed copy unable to update, since Android treats a different
    // package as a different app entirely.
    flavorDimensions "app"
    productFlavors {
        travel {
            dimension "app"
            applicationId "mytravelhub.app"
        }
        school {
            dimension "app"
            applicationId "schooltrips.app"
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// `npx cap sync` copies the web bundle into one shared assets directory, so assembling
// the school app straight after building the travel one would package the travel app
// under the school's name — silently, and pointing at the travel database. The web build
// stamps which variant it is; refuse the mismatch rather than ship it.
android.applicationVariants.all { variant ->
    def flavour = variant.flavorName
    variant.mergeAssetsProvider.configure { task ->
        task.doFirst {
            def stamp = file("src/main/assets/public/variant.txt")
            def rebuild = "  node scripts/build-variant.mjs ${flavour} && npx cap sync android"
            if (stamp.exists()) {
                def built = stamp.text.trim()
                if (built != flavour) throw new GradleException(
                    "The web bundle in assets was built as '${built}', but this is the '${flavour}' app.\n" + rebuild)
            } else if (flavour == "school") {
                // No stamp means a plain `npm run build`, which is the travel app.
                throw new GradleException(
                    "The web bundle carries no variant stamp, so it is the travel app.\n" + rebuild)
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
